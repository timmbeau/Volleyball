<title>Volleyball 9a/9b</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: Namensliste links, Bewertungspanel rechts (iPad quer); auf schmalen Bildschirmen untereinander */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f5f7fa; --line:#d6dce5;
  --ink:#152238; --muted:#5d6b80; --accent:#e8a400; --accent-ink:#3d2b00; --accent-soft:#fff3d1;
  --navy:#1f3a5f; --on-navy:#ffffff;
  --good:#2e7d4f; --good-soft:#e2f2e8; --mid:#b26b00; --warn:#b3261e; --warn-soft:#fbe5e3;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1622; --surface:#17202f; --surface-2:#1d283a; --line:#2c3a50;
  --ink:#e8edf5; --muted:#9aa8bd; --accent:#f2b630; --accent-ink:#2a1d00; --accent-soft:#3a2f12;
  --navy:#2b4c7a; --on-navy:#ffffff;
  --good:#5fc58a; --good-soft:#173527; --mid:#f0a640; --warn:#f2867d; --warn-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1622; --surface:#17202f; --surface-2:#1d283a; --line:#2c3a50;
  --ink:#e8edf5; --muted:#9aa8bd; --accent:#f2b630; --accent-ink:#2a1d00; --accent-soft:#3a2f12;
  --navy:#2b4c7a; --on-navy:#ffffff;
  --good:#5fc58a; --good-soft:#173527; --mid:#f0a640; --warn:#f2867d; --warn-soft:#3d1c1a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
h1{font-family:var(--font-display);font-weight:700;font-size:2rem;letter-spacing:.01em;margin:0;line-height:1}
h1 small{display:block;font-family:var(--font-body);font-weight:500;font-size:.85rem;color:var(--muted);letter-spacing:0;margin-top:4px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink);font:600 .95rem var(--font-body);padding:8px 14px;border-radius:7px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .95rem var(--font-body);padding:9px 14px;border-radius:10px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.status{font-size:.85rem;color:var(--muted)}
.status b{color:var(--ink);font-variant-numeric:tabular-nums}
.note{font-size:.85rem;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.main{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:14px;align-items:start}
@media (max-width:760px){.main{grid-template-columns:1fr}}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.list ol{list-style:none;margin:0;padding:0;max-height:calc(100vh - 170px);overflow-y:auto}
@media (max-width:760px){.list ol{max-height:260px}}
.list li{border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1.8rem 1fr auto;align-items:center;gap:8px;width:100%;padding:11px 12px;cursor:pointer;min-height:48px}
.list button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.list button[aria-current="true"]{background:var(--accent-soft)}
.nr{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.dots{display:flex;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--good)}
.cls-tag{font-size:.7rem;font-weight:600;color:var(--muted);letter-spacing:.06em;padding:8px 12px;background:var(--surface-2);text-transform:uppercase}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.who{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.who h2{font-family:var(--font-display);font-size:2.1rem;margin:0;line-height:1;text-wrap:balance}
.who .meta{color:var(--muted);font-size:.9rem;margin-top:4px}
.total{text-align:right}
.total .lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.total .val{font-family:var(--font-display);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.sub{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:1000px){.blocks{grid-template-columns:1fr}}
.block{background:var(--surface-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.block h3{margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--font-display);font-size:1.35rem;letter-spacing:.01em}
.block h3 span{font-family:var(--font-body);font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.crit{display:flex;flex-direction:column;gap:6px}
.crit button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:46px;font-size:.95rem}
.crit button:focus-visible{outline:3px solid var(--accent)}
.crit .box{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:transparent}
.crit button[aria-pressed="true"]{border-color:var(--good);background:var(--good-soft)}
.crit button[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.grades{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.grades button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 1.25rem var(--font-display);border-radius:8px;min-height:48px;cursor:pointer;font-variant-numeric:tabular-nums}
.grades button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.hint{font-size:.8rem;color:var(--muted);min-height:1.1em}
textarea{width:100%;box-sizing:border-box;min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;padding:8px 10px;resize:vertical}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.rule{font-size:.8rem;color:var(--muted)}
/* Übersicht */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.95rem}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
td.l,th.l{text-align:left}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--accent-soft)}
td.tot{font-weight:700}
.empty{color:var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--on-navy);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.list button,.crit button,.grades button{transition:background .12s,border-color .12s}}
</style>

<div class="wrap">
  <header>
    <h1>Volleyball 9a/9b<small>Pritschen · Baggern · Spiel · Sozial — je ⅓ Technik, Spiel, Sozial</small></h1>
    <div class="bar">
      <div class="seg" role="group" aria-label="Ansicht">
        <button id="v-tap" aria-pressed="true">Bewerten</button>
        <button id="v-tab" aria-pressed="false">Übersicht</button>
      </div>
      <div class="seg" role="group" aria-label="Klasse">
        <button data-cls="all" aria-pressed="true">Alle</button>
        <button data-cls="9a" aria-pressed="false">9a</button>
        <button data-cls="9b" aria-pressed="false">9b</button>
      </div>
      <span class="status" id="status">Lädt …</span>
    </div>
  </header>
  <div class="note" id="note" hidden></div>

  <section class="main" id="tapView">
    <nav class="list" aria-label="Schüler"><ol id="list"></ol></nav>
    <div class="panel" id="panel"></div>
  </section>

  <section id="tabView" hidden>
    <div class="foot" style="margin-bottom:10px">
      <span class="rule">Tippe auf eine Zeile, um den Schüler zu bewerten.</span>
      <button class="btn primary" id="copy">Tabelle kopieren (für Excel)</button>
    </div>
    <div class="table-wrap"><table id="table"></table></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const ROSTER = [
 ["9a","Baierl Matteo"],["9a","Bartnik Dawid"],["9a","Geissler Luca Alexander"],["9a","Glindkamp Niklas"],["9a","Glück Finn"],["9a","Hummel Henri"],["9a","Kling Silas"],["9a","Konzept Til"],["9a","Krause Fynn"],["9a","Lackmann Devin"],["9a","Nufer Theo"],["9a","Oelkuch Benaja"],["9a","Oelkuch Maximilian"],["9a","Pelk Jaron"],["9a","Sachs Julian"],["9a","Walter Joel"],
 ["9b","Bakllava Ardean"],["9b","Biqmeti Ejon"],["9b","Ehrhardt Enelio"],["9b","Elst Giuliano"],["9b","Engelmann Elias"],["9b","Grün Fabian"],["9b","Hesse Kylian Marco"],["9b","Hidayat Ryzay Alesio"],["9b","Kedak Yoshua"],["9b","Kuhn Leon"],["9b","Madi Abdullah"],["9b","Martin Lukas Valentin"],["9b","Shabelnyk Mykyta"],["9b","Sieger Luka"],["9b","Stolpa Matteo"],["9b","Wolber Phil"],["9b","Zimmermann Leon Lukas"]
].map(([cls,name],i)=>({id:"s"+String(i+1).padStart(2,"0"),nr:i+1,cls,name}));

const AREAS = [
 {key:"p",title:"Pritschen",tag:"Technik",crit:["Arme strecken sich zum Ball","Nur Fingerspitzen – kein lautes Klatschen","Ball fliegt hoch und kontrolliert"]},
 {key:"b",title:"Baggern",tag:"Technik",crit:["Hände richtig zusammen, Arme gestreckt","Ball trifft Unterarme, nicht die Fäuste","Spielt aus den Beinen, schwingt nicht"]},
 {key:"s",title:"Spiel",tag:"Spielnote",crit:["Bewegt sich zum Ball, ist spielbereit","Spielt gezielt zum Mitspieler / übers Netz","Ruft an („Hab ihn!“), hält Regeln ein"]},
 {key:"so",title:"Sozial",tag:"Sozialnote",crit:["Fair und hilfsbereit","Hält sich an Absprachen, hört zu","Motiviert, bleibt dran"]}
];
const SUGGEST = {3:1,2:2,1:4,0:5};

const data = {};            // id -> {p,b,s,so,pk,bk,sk,sok,txt}
let current = ROSTER[0].id, cls = "all", view = "tap";
let store = null, mode = "local";
const LS = "vb9ab-noten";

const $ = s=>document.querySelector(s);
const fmt = n => n==null ? "–" : (Math.round(n*10)/10).toFixed(1).replace(".",",");
const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
function calc(d){
  d = d||{};
  const tech = (d.p&&d.b) ? (d.p+d.b)/2 : null;
  const tot = (tech!=null && d.s && d.so) ? (tech+d.s+d.so)/3 : null;
  return {tech,tot};
}
const doneCount = d => d ? ["p","b","s","so"].filter(k=>d[k]).length : 0;

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}

/* ---------- Speicher ---------- */
const queues = {};
function save(id){
  const body = Object.assign({}, data[id]);
  if(mode==="db"){
    queues[id] = (queues[id]||Promise.resolve()).then(()=>store.doc("noten/"+id).set(body)).catch(e=>{
      showNote("Speichern fehlgeschlagen ("+(e&&e.code||"Fehler")+"). Die Note ist nur in diesem Fenster – bitte später erneut antippen.");
    });
  }
  try{ localStorage.setItem(LS, JSON.stringify(data)); }catch(e){}
}
function showNote(t){const n=$("#note");n.textContent=t;n.hidden=!t}

async function init(){
  try{ const raw=localStorage.getItem(LS); if(raw) Object.assign(data, JSON.parse(raw)); }catch(e){}
  renderAll();
  const c = window.claude && window.claude.use ? window.claude : null;
  const db = c ? await c.use("db") : null;
  if(!db){
    mode="local";
    showNote("Die Noten werden nur auf diesem Gerät im Browser gespeichert. Öffne die Seite in der Claude-App bzw. angemeldet, damit sie sicher online gespeichert werden.");
    updateStatus(); return;
  }
  store=db; mode="db";
  const timer=setTimeout(()=>showNote("Online-Speicher noch nicht erreichbar – angezeigte Noten sind evtl. nicht aktuell."),10000);
  db.collection("noten").onSnapshot(snap=>{
    if(!snap.metadata || !snap.metadata.fromCache){clearTimeout(timer); showNote("");}
    snap.docs.forEach(doc=>{ if(doc.exists) data[doc.id]=doc.data(); });
    snap.docChanges().forEach(ch=>{ if(ch.type==="removed") delete data[ch.doc.id]; });
    try{ localStorage.setItem(LS, JSON.stringify(data)); }catch(e){}
    renderAll();
  },err=>{clearTimeout(timer); showNote("Online-Speicher nicht verfügbar ("+(err&&err.code)+"). Noten bleiben nur auf diesem Gerät."); mode="local";});
}

/* ---------- Render ---------- */
function visible(){ return ROSTER.filter(s=>cls==="all"||s.cls===cls); }
function updateStatus(){
  const vis=visible();
  const full=vis.filter(s=>calc(data[s.id]).tot!=null).length;
  $("#status").innerHTML = `<b>${full}/${vis.length}</b> fertig bewertet · ${mode==="db"?"online gespeichert":"nur auf diesem Gerät"}`;
}
function renderList(){
  const ol=$("#list"); ol.innerHTML="";
  let lastCls=null;
  visible().forEach(s=>{
    if(cls==="all" && s.cls!==lastCls){const h=document.createElement("li");h.className="cls-tag";h.textContent="Klasse "+s.cls;ol.appendChild(h);lastCls=s.cls;}
    const li=document.createElement("li"); const b=document.createElement("button");
    b.setAttribute("aria-current", s.id===current?"true":"false");
    const d=data[s.id]||{};
    b.innerHTML=`<span class="nr">${s.nr}</span><span class="nm"></span><span class="dots">${["p","b","s","so"].map(k=>`<i class="dot ${d[k]?"on":""}"></i>`).join("")}</span>`;
    b.querySelector(".nm").textContent=s.name;
    b.onclick=()=>{current=s.id;renderList();renderPanel();if(innerWidth<=760)$("#panel").scrollIntoView({behavior:"smooth"});};
    li.appendChild(b); ol.appendChild(li);
  });
}
function renderPanel(){
  const s=ROSTER.find(x=>x.id===current); const d=data[s.id]||{}; const {tech,tot}=calc(d);
  const p=$("#panel");
  p.innerHTML=`
    <div class="who">
      <div><h2></h2><div class="meta">Nr. ${s.nr} · Klasse ${s.cls}</div></div>
      <div class="total"><div class="lbl">Gesamt</div><div class="val">${fmt(tot)}</div>
        <div class="sub">Technik ${fmt(tech)} · Spiel ${d.s||"–"} · Sozial ${d.so||"–"}</div></div>
    </div>
    <div class="blocks">${AREAS.map(a=>`
      <div class="block" data-area="${a.key}">
        <h3>${a.title}<span>${a.tag}</span></h3>
        <div class="crit">${a.crit.map((c,i)=>`<button data-c="${i}" aria-pressed="${!!(d[a.key+"k"]||[])[i]}"><span class="box">✓</span><span></span></button>`).join("")}</div>
        <div class="grades">${[1,2,3,4,5,6].map(g=>`<button data-g="${g}" aria-pressed="${d[a.key]===g}" aria-label="${a.title} Note ${g}">${g}</button>`).join("")}</div>
        <div class="hint"></div>
      </div>`).join("")}
    </div>
    <label for="txt" class="rule">Bemerkung</label>
    <textarea id="txt" placeholder="z. B. Ellbogen beim Pritschen noch gebeugt"></textarea>
    <div class="foot">
      <span class="rule">Haken setzen = Notenvorschlag: 3 → 1 · 2 → 2 · 1 → 4 · 0 → 5. Note antippen überschreibt.</span>
      <div class="bar"><button class="btn" id="prev">← Zurück</button><button class="btn primary" id="next">Weiter →</button></div>
    </div>`;
  p.querySelector("h2").textContent=s.name;
  const ta=p.querySelector("#txt"); ta.value=d.txt||"";
  ta.onchange=()=>{edit(s.id,x=>x.txt=ta.value.trim());};
  AREAS.forEach(a=>{
    const bl=p.querySelector(`[data-area="${a.key}"]`);
    bl.querySelectorAll(".crit button").forEach((b,i)=>{
      b.querySelector("span:last-child").textContent=a.crit[i];
      b.onclick=()=>edit(s.id,x=>{
        const k=(x[a.key+"k"]||[false,false,false]).slice(); k[i]=!k[i]; x[a.key+"k"]=k;
        x[a.key]=SUGGEST[k.filter(Boolean).length];
      });
    });
    bl.querySelectorAll(".grades button").forEach(b=>{
      b.onclick=()=>edit(s.id,x=>{const g=+b.dataset.g; x[a.key]= x[a.key]===g ? null : g;});
    });
    const k=(d[a.key+"k"]||[]).filter(Boolean).length;
    bl.querySelector(".hint").textContent = (d[a.key+"k"]) ? `${k} von 3 Kriterien sicher` : "";
  });
  const vis=visible(); const idx=vis.findIndex(x=>x.id===s.id);
  p.querySelector("#prev").disabled=idx<=0;
  p.querySelector("#next").textContent= idx>=vis.length-1 ? "Fertig ✓" : "Weiter →";
  p.querySelector("#prev").onclick=()=>{if(idx>0){current=vis[idx-1].id;renderList();renderPanel();}};
  p.querySelector("#next").onclick=()=>{if(idx<vis.length-1){current=vis[idx+1].id;renderList();renderPanel();}else{setView("tab");}};
}
function edit(id,fn){
  const x=Object.assign({},data[id]||{}); fn(x);
  Object.keys(x).forEach(k=>{if(x[k]==null||x[k]==="")delete x[k];});
  data[id]=x; save(id); renderAll();
}
function renderTable(){
  const rows=visible();
  const cell=v=>v?v:'<span class="empty">–</span>';
  $("#table").innerHTML=`<thead><tr><th>Nr</th><th class="l">Name</th><th>Kl.</th><th>Pritschen</th><th>Baggern</th><th>Technik</th><th>Spiel</th><th>Sozial</th><th>Gesamt</th></tr></thead><tbody>${
    rows.map(s=>{const d=data[s.id]||{};const {tech,tot}=calc(d);
      return `<tr class="clickable" data-id="${s.id}"><td>${s.nr}</td><td class="l">${s.name}</td><td>${s.cls}</td><td>${cell(d.p)}</td><td>${cell(d.b)}</td><td>${tech!=null?fmt(tech):cell()}</td><td>${cell(d.s)}</td><td>${cell(d.so)}</td><td class="tot">${tot!=null?fmt(tot):cell()}</td></tr>`}).join("")}</tbody>`;
  $("#table").querySelectorAll("tr.clickable").forEach(tr=>tr.onclick=()=>{current=tr.dataset.id;setView("tap");});
}
function renderAll(){renderList();renderPanel();renderTable();updateStatus();}
function setView(v){
  view=v; $("#tapView").hidden=v!=="tap"; $("#tabView").hidden=v!=="tab";
  $("#v-tap").setAttribute("aria-pressed",v==="tap"); $("#v-tab").setAttribute("aria-pressed",v==="tab");
  renderAll();
}
$("#v-tap").onclick=()=>setView("tap");
$("#v-tab").onclick=()=>setView("tab");
document.querySelectorAll("[data-cls]").forEach(b=>b.onclick=()=>{
  cls=b.dataset.cls; document.querySelectorAll("[data-cls]").forEach(x=>x.setAttribute("aria-pressed",x===b));
  if(!visible().some(s=>s.id===current)) current=visible()[0].id;
  renderAll();
});
$("#copy").onclick=async()=>{
  const head=["Nr","Name","Klasse","Pritschen","Baggern","Technik","Spiel","Sozial","Gesamt","Bemerkung"];
  const lines=[head.join("\t")].concat(visible().map(s=>{const d=data[s.id]||{};const {tech,tot}=calc(d);
    return [s.nr,s.name,s.cls,d.p||"",d.b||"",tech!=null?fmt(tech):"",d.s||"",d.so||"",tot!=null?fmt(tot):"",d.txt||""].join("\t")}));
  const text=lines.join("\n");
  try{await navigator.clipboard.writeText(text);toast("Kopiert – in Excel einfügen");}
  catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Kopiert");}catch(_){toast("Kopieren nicht möglich");}ta.remove();}
};
init();
</script>
